name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rollback is a re-run of an old workflow_dispatch run, otherwise a revert commit.
  # Only people with write access can re-run a workflow, and only while that
  # run's Pages artifact still exists. upload-pages-artifact keeps it for one day.
  # There is no extra input.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lang: [de, en, pt-BR, vi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tt-clips
          key: tt-clips-${{ matrix.lang }}-${{ hashFiles('public/audio/**/*.m4a', 'src/pitch/clips.test.ts') }}
      - name: ffmpeg for the shipped-clip regression
        timeout-minutes: 8
        run: |
          set -eu
          # apt has hung for the whole job budget. Each try dies after
          # three minutes, and one retry still fits in this step.
          if ! timeout 180s bash -c 'sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version'; then
            echo "ffmpeg install failed or hung, retrying once"
            sudo dpkg --configure -a || true
            timeout 180s bash -c 'sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffmpeg -version'
          fi
      - name: Chrome for the microphone clip
        if: matrix.lang == 'pt-BR' || matrix.lang == 'vi'
        timeout-minutes: 8
        run: |
          set -eu
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1 || command -v chromium-browser >/dev/null 2>&1; then
            exit 0
          fi
          deb=$(mktemp --suffix=.deb)
          fetch() { timeout 180s curl -fsSL -o "$deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb; }
          if ! fetch; then
            echo "chrome download failed, retrying once"
            fetch
          fi
          # The package lists were just updated for ffmpeg. A hung apt
          # dies after three minutes, and one retry still fits this step.
          if ! timeout 180s sudo apt-get install -y --no-install-recommends "$deb"; then
            echo "chrome install failed, retrying once"
            sudo dpkg --configure -a || true
            timeout 180s sudo apt-get install -y --no-install-recommends "$deb"
          fi
          google-chrome --version || google-chrome-stable --version
      - run: npm run test:clips
        env:
          CLIP_LANG: ${{ matrix.lang }}
          CLIP_CACHE: .cache/tt-clips

  overflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build
      - run: npm run test:overflow

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate

  # The artifact is its own job. Re-running a failed deploy must not upload
  # github-pages again: a second artifact with that name makes deploy-pages fail.
  pages-artifact:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, clips, overflow, build, audit]
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The repo has no verify-build script. This is the build check, on dist,
      # before the upload: fallback page, CSP, and no help clip in the precache.
      - name: Verify the build
        run: |
          node <<'EOF'
          const { readFileSync } = require('node:fs')
          const index = readFileSync('dist/index.html', 'utf8')
          const fallback = readFileSync('dist/404.html', 'utf8')
          const sw = readFileSync('dist/sw.js', 'utf8')
          const manifest = readFileSync('dist/manifest.webmanifest', 'utf8')
          if (!index) throw new Error('INDEX_MISSING')
          if (index !== fallback) throw new Error('SPA_FALLBACK_MISSING')
          if (!index.includes('Content-Security-Policy')) throw new Error('CSP_MISSING')
          if (!index.includes("default-src 'self'")) throw new Error('CSP_DEFAULT')
          if (index.includes('unsafe-inline') || index.includes('unsafe-eval')) throw new Error('CSP_LOOSE')
          if (!manifest.includes('/Travel-Talk/')) throw new Error('MANIFEST_BASE')
          if (/\/help\/[a-z0-9][^"'\\\s]*\.m4a/.test(sw)) throw new Error('HELP_IN_PRECACHE')
          EOF
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [pages-artifact]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # A queued push must not publish after main has moved. That case is a
      # notice, not a failed job. A network or ls-remote error still fails.
      # workflow_dispatch skips the comparison: re-running an old manual run
      # is the rollback. The remote URL is built from runner env vars only.
      - name: Require this commit to still be the head of main
        id: head
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: skipping the check that this commit is still the tip of main."
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          line=$(git ls-remote "$url" refs/heads/main)
          tip=${line%%[[:space:]]*}
          if [ -z "$tip" ]; then
            echo "Could not read refs/heads/main. Refusing to deploy." >&2
            exit 1
          fi
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::This commit is no longer the head of main. Skipping deploy. This run: ${GITHUB_SHA}. main: ${tip}."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - id: deployment
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
